<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Startup Connect | AGUI</title>

  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.0.0",
      "react/": "https://esm.sh/react@19.0.0/",
      "react-dom": "https://esm.sh/react-dom@19.0.0",
      "react-dom/": "https://esm.sh/react-dom@19.0.0/",
      "react-router-dom": "https://esm.sh/react-router-dom@7.1.1",
      "lucide-react": "https://esm.sh/lucide-react@0.471.0",
      "recharts": "https://esm.sh/recharts@2.15.0",
      "clsx": "https://esm.sh/clsx@2.1.1",
      "tailwind-merge": "https://esm.sh/tailwind-merge@2.6.0",
      "@google/genai": "https://esm.sh/@google/genai@0.1.3"
    }
  }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            display: ['Space Grotesk', 'Inter', 'sans-serif'],
          },
          colors: {
            background: '#0f172a',
            foreground: '#f8fafc',
            slate: {
              850: '#1e293b',
              900: '#0f172a',
              950: '#020617',
            },
            primary: {
              DEFAULT: '#0EA5E9',
              dark: '#0369A1',
              foreground: '#ffffff',
            },
            secondary: {
              DEFAULT: '#10B981',
              foreground: '#ffffff',
            },
            accent: {
              gold: '#D97706',
            },
            sky: {
              DEFAULT: '#0EA5E9',
              50: '#f0f9ff',
              400: '#38bdf8',
              500: '#0EA5E9',
              600: '#0284c7',
              700: '#0369A1',
            }
          },
          backgroundImage: {
            'gemini-gradient': 'linear-gradient(135deg, #0EA5E9 0%, #10B981 50%, #D97706 100%)',
            'glass': 'linear-gradient(145deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%)',
            'hero-gradient': 'radial-gradient(ellipse at top, rgba(14, 165, 233, 0.15), transparent 50%)',
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'slide-up': 'slideUp 0.3s ease-out',
            'scale-in': 'scaleIn 0.2s ease-out',
            'shimmer': 'shimmer 2s linear infinite',
            'gradient-x': 'gradient-x 15s ease infinite',
            'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-20px)' },
            },
            slideUp: {
              '0%': { transform: 'translateY(10px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            fadeInUp: {
              '0%': { transform: 'translateY(20px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            gradient- x: {
      '0%, 100%': {
        'background-size': '200% 200%',
          'background-position': 'left center'
      },
      '50%': {
        'background-size': '200% 200%',
          'background-position': 'right center'
      },
    },
    scaleIn: {
      '0%': { transform: 'scale(0.95)', opacity: '0' },
      '100%': { transform: 'scale(1)', opacity: '1' },
    },
    shimmer: {
      '0%': { backgroundPosition: '-1000px 0' },
      '100%': { backgroundPosition: '1000px 0' },
    },
          },
    boxShadow: {
      'glow': '0 0 20px rgba(14, 165, 233, 0.3)',
        'glow-lg': '0 0 40px rgba(14, 165, 233, 0.4)',
          'inner-glow': 'inset 0 0 20px rgba(14, 165, 233, 0.1)',
          },
    letterSpacing: {
      tighter: '-0.05em',
        tight: '-0.025em',
          normal: '0',
            wide: '0.025em',
              wider: '0.05em',
                widest: '0.1em',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      width: 100vw;
    }

    #root {
      height: 100%;
      width: 100%;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* 3D Transform Utilities */
    .perspective-1000 {
      perspective: 1000px;
    }

    .rotate-x-12 {
      transform: rotateX(12deg);
    }

    .rotate-x-0 {
      transform: rotateX(0deg);
    }

    /* Custom Masks */
    .mask-linear-fade {
      mask-image: linear-gradient(to right, black 80%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, black 80%, transparent 100%);
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="index.tsx"></script>
</body>

</html>
