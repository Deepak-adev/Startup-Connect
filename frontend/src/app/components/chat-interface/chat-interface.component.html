<div class="fixed bottom-6 right-6 z-50 flex flex-col items-end pointer-events-auto">
  
  <!-- Floating Toggle Button (Visible when chat is closed or collapsed) -->
  <button *ngIf="!isOpen" 
          (click)="toggleChat()"
          class="px-5 py-3.5 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-bold rounded-full shadow-2xl hover:shadow-indigo-500/25 transition-all transform hover:scale-105 flex items-center gap-3 border border-indigo-400/30 cursor-pointer group">
    
    <div class="relative flex items-center justify-center">
      <span class="text-xl">✨</span>
      <span class="absolute -top-1 -right-1 flex h-3 w-3">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
      </span>
    </div>

    <span class="text-sm tracking-wide">AGUI AI Co-Pilot</span>

    <!-- Unread Badge -->
    <span *ngIf="unreadCount > 0" class="ml-1 px-2 py-0.5 bg-emerald-500 text-white text-xs font-black rounded-full animate-bounce">
      {{ unreadCount }}
    </span>
  </button>

  <!-- Right Slide-In Chat Window -->
  <div *ngIf="isOpen" 
       class="w-80 md:w-96 bg-white/90 backdrop-blur-xl rounded-3xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col h-[550px] max-h-[85vh] transition-all duration-300 animate-in slide-in-from-bottom-5 md:slide-in-from-right-5">
    
    <!-- Header -->
    <div class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 p-4 border-b border-slate-800 text-white flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="relative">
          <div class="w-9 h-9 rounded-2xl bg-indigo-600/40 border border-indigo-400/30 flex items-center justify-center text-lg">
            ✨
          </div>
          <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-emerald-500 ring-2 ring-slate-900"></span>
        </div>
        <div>
          <h3 class="font-extrabold text-sm text-white flex items-center gap-2">
            AGUI Co-Pilot
            <span class="text-[10px] bg-indigo-500/30 text-indigo-300 px-2 py-0.5 rounded-full border border-indigo-500/40">AI Engine</span>
          </h3>
          <p class="text-[11px] text-slate-400">Autonomous Interface Steering</p>
        </div>
      </div>

      <!-- Controls -->
      <div class="flex items-center space-x-1">
        <button (click)="toggleChat()" title="Minimize" class="p-1.5 text-slate-400 hover:text-white rounded-lg hover:bg-white/10 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </button>
      </div>
    </div>

    <!-- Message History -->
    <div class="flex-1 overflow-y-auto p-4 space-y-3.5 bg-slate-50/50 text-xs">
      <div *ngFor="let msg of messages" 
           [ngClass]="{'flex justify-end': msg.isUser, 'flex justify-start': !msg.isUser}">
        <div class="max-w-[85%] rounded-2xl p-3.5 shadow-sm leading-relaxed"
             [ngClass]="msg.isUser ? 'bg-indigo-600 text-white font-medium rounded-tr-none' : 'bg-white text-slate-800 border border-slate-200/80 rounded-tl-none'">
          
          <div *ngIf="msg.isProcessing" class="flex space-x-1.5 items-center h-4 py-1">
            <div class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce" style="animation-delay: 0ms"></div>
            <div class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce" style="animation-delay: 150ms"></div>
            <div class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce" style="animation-delay: 300ms"></div>
          </div>
          
          <span *ngIf="!msg.isProcessing" class="whitespace-pre-wrap">{{ msg.text }}</span>
        </div>
      </div>
    </div>

    <!-- Command Prompt Suggestion Chips -->
    <div class="px-3 py-2 bg-slate-100/70 border-t border-slate-200/60 flex items-center gap-1.5 overflow-x-auto text-[11px]">
      <span class="text-slate-400 font-bold uppercase text-[10px]">Try:</span>
      <button (click)="userInput = 'show tech partners'; sendMessage()" class="px-2.5 py-1 bg-white hover:bg-slate-200 text-slate-700 rounded-lg border border-slate-200 whitespace-nowrap transition-colors">
        🤝 Tech Partners
      </button>
      <button (click)="userInput = 'analyze market'; sendMessage()" class="px-2.5 py-1 bg-white hover:bg-slate-200 text-slate-700 rounded-lg border border-slate-200 whitespace-nowrap transition-colors">
        📈 Market Analysis
      </button>
      <button (click)="userInput = 'pitch deck'; sendMessage()" class="px-2.5 py-1 bg-white hover:bg-slate-200 text-slate-700 rounded-lg border border-slate-200 whitespace-nowrap transition-colors">
        🚀 Pitch Deck
      </button>
    </div>

    <!-- Input Box -->
    <div class="p-3 bg-white border-t border-slate-200">
      <div class="relative flex items-center">
        <input type="text" 
               [(ngModel)]="userInput" 
               (keyup.enter)="sendMessage()"
               placeholder="Ask AGUI to navigate or assist..."
               class="w-full pl-4 pr-12 py-3 rounded-xl border border-slate-200 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 transition-all" />
        
        <button (click)="sendMessage()" 
                [disabled]="!userInput.trim()"
                class="absolute right-2 p-2 bg-indigo-600 disabled:bg-slate-300 text-white rounded-lg hover:bg-indigo-700 transition-all cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </button>
      </div>
    </div>

  </div>

</div>
