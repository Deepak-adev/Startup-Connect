<div class="fixed bottom-6 right-6 w-96 flex flex-col items-end z-50">
  
  <!-- Chat Window -->
  <div class="glass w-full rounded-2xl shadow-2xl mb-4 overflow-hidden flex flex-col h-[500px] transition-all duration-300">
    <!-- Header -->
    <div class="bg-gradient-to-r from-spark-blue to-spark-green p-4 border-b border-white/20">
      <h3 class="font-bold text-gray-800 flex items-center">
        <span class="w-2 h-2 rounded-full bg-green-500 mr-2 animate-pulse"></span>
        AGUI Co-Pilot
      </h3>
    </div>

    <!-- Messages -->
    <div class="flex-1 overflow-y-auto p-4 space-y-4 bg-white/40">
      <div *ngFor="let msg of messages" 
           [ngClass]="{'flex justify-end': msg.isUser, 'flex justify-start': !msg.isUser}">
        <div class="max-w-[80%] rounded-2xl p-3 shadow-sm"
             [ngClass]="msg.isUser ? 'bg-indigo-600 text-white rounded-tr-none' : 'glass text-gray-800 rounded-tl-none'">
          
          <div *ngIf="msg.isProcessing" class="flex space-x-1 items-center h-5">
            <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce" style="animation-delay: 0ms"></div>
            <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce" style="animation-delay: 150ms"></div>
            <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce" style="animation-delay: 300ms"></div>
          </div>
          
          <span *ngIf="!msg.isProcessing" class="text-sm">{{ msg.text }}</span>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="p-3 bg-white/60 border-t border-white/30">
      <div class="relative">
        <input type="text" 
               [(ngModel)]="userInput" 
               (keyup.enter)="sendMessage()"
               placeholder="Tell AGUI what to do..."
               class="w-full pl-4 pr-12 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white/80 backdrop-blur-sm transition-all" />
        <button (click)="sendMessage()" 
                class="absolute right-2 top-2 p-1.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 1.414L10.586 9H7a1 1 0 100 2h3.586l-1.293 1.293a1 1 0 101.414 1.414l3-3a1 1 0 000-1.414z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
