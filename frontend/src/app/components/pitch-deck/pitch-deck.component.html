<div class="col-span-3">
  <div class="flex justify-between items-end mb-6">
    <div>
      <h2 class="text-3xl font-extrabold text-slate-800">Pitch Deck Visualizer</h2>
      <p class="text-slate-500 mt-1">Generated by Logo Agent & Gemini</p>
    </div>
    <button class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition-colors">
      Export PDF
    </button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    <div *ngFor="let slide of slides" class="glass rounded-3xl overflow-hidden shadow-xl hover:shadow-2xl transition-all transform hover:-translate-y-1">
      <img [src]="slide.image" [alt]="slide.title" class="w-full h-48 object-cover border-b border-slate-100">
      <div class="p-6 bg-white/60 backdrop-blur-md">
        <h3 class="text-xl font-bold text-slate-800 mb-2">{{ slide.title }}</h3>
        <p class="text-slate-600 text-sm">{{ slide.content }}</p>
      </div>
    </div>
  </div>
</div>
