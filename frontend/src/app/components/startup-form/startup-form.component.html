<div class="glass p-8 rounded-3xl shadow-xl bg-gradient-to-br from-white to-spark-blue/10">
  <h2 class="text-2xl font-extrabold text-slate-800 mb-6">Register Your Startup Profile</h2>
  
  <form (ngSubmit)="submitForm()" class="space-y-6">
    <!-- Startup Name -->
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">Startup Name</label>
      <input type="text" [(ngModel)]="startupName" name="startupName" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 bg-white/70" placeholder="e.g. Acme Corp">
    </div>

    <!-- Industry -->
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">Industry</label>
      <select [(ngModel)]="industry" name="industry" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 bg-white/70">
        <option value="technology">Technology</option>
        <option value="manufacturing">Manufacturing</option>
        <option value="retail">Retail & E-commerce</option>
        <option value="healthcare">Healthcare</option>
      </select>
    </div>

    <!-- Core Weakness -->
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">Primary Operational Weakness</label>
      <textarea [(ngModel)]="weakness" name="weakness" rows="3" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 bg-white/70" placeholder="e.g. We lack a robust supply chain network..."></textarea>
    </div>

    <!-- Submit -->
    <button type="submit" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg hover:shadow-xl transition-all">
      Save Profile & Run AGUI Analysis
    </button>
  </form>
</div>
