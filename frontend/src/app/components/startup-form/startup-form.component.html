<div class="glass p-8 rounded-3xl shadow-xl bg-gradient-to-br from-white to-indigo-50/30 border border-slate-100">
  <h2 class="text-2xl font-extrabold text-slate-800 mb-2">Register Your Startup Profile</h2>
  <p class="text-sm text-slate-500 mb-6">Submitted startups are saved directly to your MongoDB database instance.</p>

  <div *ngIf="successMessage" class="mb-6 p-4 bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-xl text-sm font-semibold flex items-center justify-between">
    <span>✅ {{ successMessage }}</span>
  </div>

  <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm font-semibold">
    ❌ {{ errorMessage }}
  </div>
  
  <form (ngSubmit)="submitForm()" class="space-y-5">
    <!-- Startup Name -->
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">Startup Name</label>
      <input type="text" [(ngModel)]="startupName" name="startupName" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 bg-white/70" placeholder="e.g. Acme HealthTech">
    </div>

    <!-- Industry & Location -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Industry</label>
        <select [(ngModel)]="industry" name="industry" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 bg-white/70">
          <option value="Technology">Technology</option>
          <option value="CleanTech">CleanTech</option>
          <option value="Healthcare">Healthcare</option>
          <option value="Fintech">Fintech</option>
          <option value="Logistics">Logistics</option>
          <option value="Agriculture">Agriculture</option>
          <option value="Cybersecurity">Cybersecurity</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Location</label>
        <input type="text" [(ngModel)]="location" name="location" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 bg-white/70" placeholder="e.g. Austin, TX">
      </div>
    </div>

    <!-- Description -->
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">Description</label>
      <textarea [(ngModel)]="description" name="description" rows="2" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 bg-white/70" placeholder="Briefly describe what your startup builds..."></textarea>
    </div>

    <!-- Core Weakness -->
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">Primary Operational Weakness / Needs</label>
      <textarea [(ngModel)]="weakness" name="weakness" rows="2" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 bg-white/70" placeholder="e.g. We lack a robust supply chain network..."></textarea>
    </div>

    <!-- Funding -->
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">Funding Stage</label>
      <input type="text" [(ngModel)]="funding" name="funding" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 bg-white/70" placeholder="e.g. $1.2M Seed">
    </div>

    <!-- Submit -->
    <button type="submit" [disabled]="isSubmitting" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-300 text-white font-bold rounded-xl shadow-lg hover:shadow-xl transition-all cursor-pointer">
      {{ isSubmitting ? 'Saving to MongoDB...' : 'Save Profile to MongoDB' }}
    </button>
  </form>
</div>
