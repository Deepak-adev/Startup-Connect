spring:
  application:
    name: startup-connect-backend

  data:
    mongodb:
      uri: mongodb://localhost:27017/startupconnect
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

socketio:
  host: 0.0.0.0
  port: 9092

gemini:
  api:
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent
    key: ${GEMINI_API_KEY:mock_key_for_now}

chromadb:
  url: http://localhost:8000
